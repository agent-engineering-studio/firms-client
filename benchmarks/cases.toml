  [[case.check]]
  kind = "season"
  name = "among the three worst years of 2012-2025"
  stat = "rank"
  max = 3

[[case]]
id = "season-2017"
title = "Italy, 2017: the record before 2021"
status = "season"
product = "viirs-snpp"
year = 2017
source = """EFFIS, cited by ANSA (25 August 2021): about 141,000 ha burnt in Italy in \
2017, the worst year until 2021 \
(https://www.ansa.it/english/news/2021/08/25/wildfires-have-claimed-area-equal-to-rome-naples-milan_e1f38b05-1da9-46d4-a280-0725d8ac78cd.html)."""

  [[case.check]]
  kind = "season"
  name = "among the three worst years of 2012-2025"
  stat = "rank"
  max = 3
