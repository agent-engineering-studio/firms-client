# Crop burning or wildfire: the land under the fire, by EFFIS.
#
# The truth is the EFFIS burnt-area database (layer modis.ba.poly), mapped
# from satellite images of the burnt area, not from FIRMS hotspots: every
# perimeter carries the CORINE shares of the land that burnt. CC BY 4.0,
# © European Union, 1995-2025 (https://forest-fire.emergency.copernicus.eu/about-effis/data-license).
#
# The rule that picked the cases, written before running the library: for
# each fire season 2021-2025 in Italy, the largest perimeter of at least
# 100 ha whose land was at least 90 % agricultural (AGRIAREAS), and the
# largest whose land was at least 90 % natural (BROADLEA + CONIFER + MIXED +
# SCLEROPH + TRANSIT + OTHERNATLC). The window is the perimeter's dates, one
# day either side.
#
# EFFIS says what land burnt, not why: a fire on cropland may be stubble
# burning or an accident, and stubble fires smaller than ~30 ha are not
# mapped at all. So the agricultural cases ask for crop_burning or
# cropland_fire, not for crop_burning alone.
#
#   burning  classify_burning on the select()-ed detections inside the
#            perimeter, read on the WorldCover crop: 1 when its kind is in
#            kinds, else 0; no detection inside is "not measured".

[[case]]
id = "sindia-2021"
title = "Sindia, Sardinia, 12 July 2021: 914 ha, 95 % agricultural"
status = "cropland"
product = "viirs-snpp"
year = 2021
box = [8.64, 40.26, 8.72, 40.33]
window = ["2021-07-11", "2021-07-13"]
effis_id = "50687"
source = """EFFIS burnt-area database, perimeter 50687: 914 ha from 2021-07-12 to 2021-07-12, \
95 % agricultural land (CORINE). © European Union, 1995-2025, CC BY 4.0."""

  [[case.check]]
  kind = "burning"
  name = "classified as a fire on cropland"
  kinds = ["crop_burning", "cropland_fire"]
  min = 1

