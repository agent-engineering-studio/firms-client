# The real service, once a week and by hand: the archive's columns, the
# missing-data table and, with the FIRMS_MAP_KEY secret, the key's status,
# the data availability and a day of the area API. A failure here is a
# change of the service's contract, not of this code.
name: live

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync pytest -m live -v
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
