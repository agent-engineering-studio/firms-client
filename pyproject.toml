[project]
name = "firms-client"
version = "0.10.0"
description = "Client for NASA FIRMS active fires: open per-country archives, NRT area API, detection types"
readme = "README.md"
keywords = ["firms", "nasa", "wildfire", "active fire", "hotspot", "modis", "viirs", "remote sensing"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Giuseppe Zileni", email = "giuseppe.zileni@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
firms = "firms_client.cli:main"
firms-mcp = "firms_client.mcp_server:main"

[project.urls]
Homepage = "https://agentengineering.it/firms-client/"
Source = "https://github.com/agent-engineering-studio/firms-client"
Issues = "https://github.com/agent-engineering-studio/firms-client/issues"
Changelog = "https://github.com/agent-engineering-studio/firms-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = [
    "mcp>=2.3,<3",
]
claude = [
    "anthropic>=2.4,<3",
]
landcover = [
    "rasterio>=1.4",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
docs = [
    "pdoc>=16.0.0",
]
# The API behind the page of a Comune (demo/api.py).
demo = [
    "starlette>=0.46",
    "uvicorn>=0.34",
]
# The notebooks (notebooks/), and JupyterLab in the notebook container.
examples = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "B018"]
# Notebooks favour readable plotting calls over the line limit.
"notebooks/**" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "benchmarks", "demo"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["rasterio", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not live'"
markers = ["live: talks to the real FIRMS service (weekly in CI)"]

[tool.coverage.run]
source = ["firms_client"]

[tool.coverage.report]
fail_under = 90
show_missing = true
