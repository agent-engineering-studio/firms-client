<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 406" role="img" aria-label="Monthly VIIRS detections over Italy in 2025, stacked: vegetation fires peak in July (4,859); the other types stay between 255 and 875 a month">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .ax{fill:#7a7974} .chip{fill:#f0efec} .veg{fill:#eb6834} .ind{fill:#2a78d6} .off{fill:#1baf7a} .vol{fill:#eda100} .na{fill:#d9d8d2} .grid{stroke:#e6e5e0;stroke-width:1} .mark{stroke:#0b0b0b}
  @media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .ax{fill:#8f8e88} .chip{fill:#2a2a28} .veg{fill:#d95926} .ind{fill:#3987e5} .off{fill:#199e70} .vol{fill:#c98500} .na{fill:#45443f} .grid{stroke:#2e2e2b;stroke-width:1} .mark{stroke:#f0efec} }
</style>
<rect class="bg" width="980" height="406" rx="14"/>
<text class="t1" x="40" y="42" font-size="20" font-weight="700">Fires come in summer. Factories burn all year.</text><text class="t2" x="40" y="64" font-size="14">VIIRS S-NPP detections over Italy per month, 2025. In winter most hotspots are not fires at all.</text><line class="grid" x1="90" y1="332.0" x2="940" y2="332.0"/><text class="ax" x="80" y="336.0" font-size="11" text-anchor="end">0</text><line class="grid" x1="90" y1="272.0" x2="940" y2="272.0"/><text class="ax" x="80" y="276.0" font-size="11" text-anchor="end">1,500</text><line class="grid" x1="90" y1="212.0" x2="940" y2="212.0"/><text class="ax" x="80" y="216.0" font-size="11" text-anchor="end">3,000</text><line class="grid" x1="90" y1="152.0" x2="940" y2="152.0"/><text class="ax" x="80" y="156.0" font-size="11" text-anchor="end">4,500</text><line class="grid" x1="90" y1="92.0" x2="940" y2="92.0"/><text class="ax" x="80" y="96.0" font-size="11" text-anchor="end">6,000</text><rect class="ind" x="103.5" y="321.5" width="43.9" height="10.5" rx="2"/><rect class="veg" x="103.5" y="318.4" width="43.9" height="1.0" rx="3"/><text class="ax" x="125.4" y="350" font-size="12" text-anchor="middle">Jan</text><text class="t2" x="125.4" y="310.4" font-size="12" text-anchor="middle">22% fire</text><rect class="ind" x="174.3" y="320.3" width="43.9" height="11.7" rx="2"/><rect class="veg" x="174.3" y="315.6" width="43.9" height="2.7" rx="3"/><text class="ax" x="196.2" y="350" font-size="12" text-anchor="middle">Feb</text><rect class="ind" x="245.1" y="315.6" width="43.9" height="16.4" rx="2"/><rect class="veg" x="245.1" y="301.3" width="43.9" height="12.3" rx="3"/><text class="ax" x="267.1" y="350" font-size="12" text-anchor="middle">Mar</text><rect class="ind" x="316.0" y="310.5" width="43.9" height="21.5" rx="2"/><rect class="veg" x="316.0" y="297.6" width="43.9" height="10.9" rx="3"/><text class="ax" x="337.9" y="350" font-size="12" text-anchor="middle">Apr</text><rect class="ind" x="386.8" y="311.6" width="43.9" height="20.4" rx="2"/><rect class="veg" x="386.8" y="288.0" width="43.9" height="21.6" rx="3"/><text class="ax" x="408.7" y="350" font-size="12" text-anchor="middle">May</text><rect class="ind" x="457.6" y="297.0" width="43.9" height="35.0" rx="2"/><rect class="veg" x="457.6" y="176.3" width="43.9" height="118.7" rx="3"/><text class="ax" x="479.6" y="350" font-size="12" text-anchor="middle">Jun</text><rect class="ind" x="528.5" y="306.1" width="43.9" height="25.9" rx="2"/><rect class="veg" x="528.5" y="111.7" width="43.9" height="192.4" rx="3"/><text class="ax" x="550.4" y="350" font-size="12" text-anchor="middle">Jul</text><text class="t2" x="550.4" y="103.7" font-size="12" text-anchor="middle">88% fire</text><rect class="ind" x="599.3" y="307.6" width="43.9" height="24.4" rx="2"/><rect class="veg" x="599.3" y="139.1" width="43.9" height="166.6" rx="3"/><text class="ax" x="621.2" y="350" font-size="12" text-anchor="middle">Aug</text><rect class="ind" x="670.1" y="306.9" width="43.9" height="25.1" rx="2"/><rect class="veg" x="670.1" y="196.8" width="43.9" height="108.0" rx="3"/><text class="ax" x="692.1" y="350" font-size="12" text-anchor="middle">Sep</text><rect class="ind" x="741.0" y="315.1" width="43.9" height="16.9" rx="2"/><rect class="veg" x="741.0" y="273.8" width="43.9" height="39.4" rx="3"/><text class="ax" x="762.9" y="350" font-size="12" text-anchor="middle">Oct</text><rect class="ind" x="811.8" y="317.4" width="43.9" height="14.6" rx="2"/><rect class="veg" x="811.8" y="312.6" width="43.9" height="2.7" rx="3"/><text class="ax" x="833.8" y="350" font-size="12" text-anchor="middle">Nov</text><rect class="ind" x="882.6" y="321.8" width="43.9" height="10.2" rx="2"/><rect class="veg" x="882.6" y="318.7" width="43.9" height="1.1" rx="3"/><text class="ax" x="904.6" y="350" font-size="12" text-anchor="middle">Dec</text><text class="t2" x="904.6" y="310.7" font-size="12" text-anchor="middle">23% fire</text><rect class="veg" x="90" y="370" width="13" height="13" rx="3"/><text class="t2" x="111" y="381" font-size="14">Vegetation fire (type 0)</text><rect class="ind" x="330" y="370" width="13" height="13" rx="3"/><text class="t2" x="351" y="381" font-size="14">Everything else: industry, volcano, offshore (type 1-3)</text>
</svg>
