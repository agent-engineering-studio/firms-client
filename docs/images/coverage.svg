<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 375" role="img" aria-label="Timeline: MODIS archive from 2000 and VIIRS S-NPP from 2012, both open with no key; VIIRS NOAA-20 and NOAA-21 only through the near-real-time area API with a MAP_KEY">
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .bg{fill:#fcfcfb} .t1{fill:#0b0b0b} .t2{fill:#52514e} .ax{fill:#7a7974} .chip{fill:#f0efec} .veg{fill:#eb6834} .ind{fill:#2a78d6} .off{fill:#1baf7a} .vol{fill:#eda100} .na{fill:#d9d8d2} .grid{stroke:#e6e5e0;stroke-width:1} .mark{stroke:#0b0b0b}
  @media (prefers-color-scheme: dark){ .bg{fill:#1a1a19} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .ax{fill:#8f8e88} .chip{fill:#2a2a28} .veg{fill:#d95926} .ind{fill:#3987e5} .off{fill:#199e70} .vol{fill:#c98500} .na{fill:#45443f} .grid{stroke:#2e2e2b;stroke-width:1} .mark{stroke:#f0efec} }
</style>
<rect class="bg" width="980" height="375" rx="14"/>
<text class="t1" x="40" y="42" font-size="20" font-weight="700">26 years of fires, two doors in</text><text class="t2" x="40" y="64" font-size="14">Open per-country archives for the history, the area API for the last days.</text><line class="grid" x1="230.0" y1="86" x2="230.0" y2="300"/><text class="ax" x="230.0" y="318" font-size="11" text-anchor="middle">2000</text><line class="grid" x1="359.6" y1="86" x2="359.6" y2="300"/><text class="ax" x="359.6" y="318" font-size="11" text-anchor="middle">2005</text><line class="grid" x1="489.3" y1="86" x2="489.3" y2="300"/><text class="ax" x="489.3" y="318" font-size="11" text-anchor="middle">2010</text><line class="grid" x1="618.9" y1="86" x2="618.9" y2="300"/><text class="ax" x="618.9" y="318" font-size="11" text-anchor="middle">2015</text><line class="grid" x1="748.5" y1="86" x2="748.5" y2="300"/><text class="ax" x="748.5" y="318" font-size="11" text-anchor="middle">2020</text><line class="grid" x1="878.1" y1="86" x2="878.1" y2="300"/><text class="ax" x="878.1" y="318" font-size="11" text-anchor="middle">2025</text><text class="t1" x="216" y="118" font-size="14" font-weight="600" text-anchor="end">MODIS (Terra + Aqua)</text><rect class="veg" x="230.0" y="100" width="672.1" height="26" rx="4"/><rect class="ind" x="904.1" y="100" width="21.8" height="26" rx="4"/><text class="t2" x="240.0" y="118" font-size="12">archive 2000-2025 · no key</text><text class="t1" x="216" y="166" font-size="14" font-weight="600" text-anchor="end">VIIRS S-NPP</text><rect class="veg" x="541.1" y="148" width="361.0" height="26" rx="4"/><rect class="ind" x="904.1" y="148" width="21.8" height="26" rx="4"/><text class="t2" x="551.1" y="166" font-size="12">archive 2012-2025 · no key</text><text class="t1" x="216" y="214" font-size="14" font-weight="600" text-anchor="end">VIIRS NOAA-20</text><rect class="na" x="696.7" y="196" width="205.4" height="26" rx="4"/><rect class="ind" x="904.1" y="196" width="21.8" height="26" rx="4"/><text class="t2" x="706.7" y="214" font-size="12">area API only · MAP_KEY</text><text class="t1" x="216" y="262" font-size="14" font-weight="600" text-anchor="end">VIIRS NOAA-21</text><rect class="na" x="826.3" y="244" width="75.8" height="26" rx="4"/><rect class="ind" x="904.1" y="244" width="21.8" height="26" rx="4"/><text class="t2" x="816.3" y="262" font-size="12" text-anchor="end">area API only · MAP_KEY</text><rect class="veg" x="40" y="288" width="13" height="13" rx="3" transform="translate(0,52)"/><text class="t2" x="61" y="351" font-size="13">per-country yearly CSV (fetch_archive)</text><rect class="ind" x="358" y="288" width="13" height="13" rx="3" transform="translate(0,52)"/><text class="t2" x="379" y="351" font-size="13">near-real-time (fetch_area)</text><rect class="na" x="599" y="288" width="13" height="13" rx="3" transform="translate(0,52)"/><text class="t2" x="620" y="351" font-size="13">satellite flying, no country archive</text>
</svg>
